name: {{MACHINE}}
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${JETSTREAM_HOST_PORT:-8080}:80"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DRUPAL_DB_NAME:-drupal}
      MYSQL_USER: ${DRUPAL_DB_USER:-drupal}
      MYSQL_PASSWORD: ${DRUPAL_DB_PASSWORD:-drupal}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    profiles: ["redis"]
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
