# Dependabot: daily 06:00 WIB version updates (Renovate covers 06:00 + 18:00).
# NOTE: no composer block for template/ — its composer.json holds {{TOKENS}}
# until installed, which the updater cannot parse. The docker block stays:
# Dockerfile.web has no tokens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /template
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, docker]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
